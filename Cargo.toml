[package]
name = "dawl-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic compound workflow diagrams for the terminal"
license = "MIT"
repository = "https://github.com/mateusdcc/dawl-tui"
keywords = ["tui", "diagram", "workflow", "graph", "dawl"]
categories = ["command-line-utilities", "visualization"]

[lib]
name = "dawl_tui"
path = "src/lib.rs"

[[bin]]
name = "dawl-tui"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
